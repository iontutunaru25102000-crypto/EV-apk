$('bk3').onclick=()=>{try{const o=JSON.parse(bx.value);if(!Array.isArray(o.log))throw 0;L=o.log;S.set('ev-log',L);if(Array.isArray(o.st)){P=o.st;S.set('ev-st',P)}if(o.inp){S.set('ev-in',o.inp);ins.forEach(x=>{if(o.inp[x.id]!==undefined)x.value=o.inp[x.id]})}jr();sr();calc();T('bkm',t('bk_done'))}catch(e){T('bkm',t('bk_err'))}};
function lang(){document.documentElement.lang=['ro','ru','en'][li];document.title=t('title').replace('⚡ ','');T('ttl','⚡ '+t('t_'+cur0));
 document.querySelectorAll('[data-i]').forEach(x=>{x.textContent=t(x.dataset.i)});document.querySelectorAll('[data-ph]').forEach(x=>{x.placeholder=t(x.dataset.ph)});
 nav();calc();jr();sr()}
$('lang').value=li;$('lang').addEventListener('change',()=>{li=+$('lang').value;S.set('ev-lang',li);lang()});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOC=()=>['ro-RO','ru-RU','en-US'][li],mkey=x=>(x.d||'').slice(0,7);
function chart(id,items,dec){const box=$(id);if(!items.length||items.every(x=>!x.v)){box.textContent=t('ch_none');return}
 const W=320,H=170,base=135,top=22,mx=Math.max(...items.map(x=>x.v))||1,slot=(W-16)/items.length,bw=Math.min(40,slot*0.6);
 let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img"><line x1="8" x2="312" y1="'+base+'" y2="'+base+'" style="stroke:var(--line)"/>';
 items.forEach((x,i)=>{const hh=Math.max(1,x.v/mx*(base-top)),cx=8+slot*i+slot/2;
  s+='<rect x="'+(cx-bw/2)+'" y="'+(base-hh)+'" width="'+bw+'" height="'+hh+'" rx="3" style="fill:var(--accent)"/>';
  s+='<text x="'+cx+'" y="'+(base-hh-4)+'" font-size="10" text-anchor="middle" style="fill:var(--text)">'+fmt(x.v,dec)+'</text>';
  s+='<text x="'+cx+'" y="152" font-size="10" text-anchor="middle" style="fill:var(--muted)">'+esc(x.l)+'</text>'});
 box.innerHTML=s+'</svg>'}
function chartsJ(){
 const now=new Date(),ms=[];for(let i=5;i>=0;i--){const q=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push(q.getFullYear()+'-'+String(q.getMonth()+1).padStart(2,'0'))}
 chart('chm',ms.map(k=>({l:k.slice(5)+'/'+k.slice(2,4),v:L.filter(x=>mkey(x)===k).reduce((a,x)=>a+x.l,0)})),0);
 const od=L.filter(x=>x.o).sort((a,b)=>a.o-b.o),cs=[];
 for(let i=1;i<od.length;i++){const dk=od[i].o-od[i-1].o;if(dk>0)cs.push({l:(od[i].d||'').slice(8)+'.'+(od[i].d||'').slice(5,7),v:od[i].k/dk*100})}
 chart('chc',cs.slice(-8),1)}
function chartS(){chart('chs',P.slice().sort((a,b)=>a.p-b.p).slice(0,6).map(x=>({l:x.n.slice(0,7),v:x.p})),2)}
$('rpb').onclick=()=>{let mk=new Date().toISOString().slice(0,7);
 if(!L.some(x=>mkey(x)===mk)){const q=L.map(mkey).filter(Boolean).sort();mk=q[q.length-1]}
 if(!mk){bx.value=t('rp_none');cp();return}
 const es=L.filter(x=>mkey(x)===mk),k=es.reduce((a,x)=>a+x.k,0),l=es.reduce((a,x)=>a+x.l,0),od=es.filter(x=>x.o).sort((a,b)=>a.o-b.o);
 let s=t('rp_head')+' '+new Date(mk+'-15').toLocaleDateString(LOC(),{month:'long',year:'numeric'})+': '+es.length+' '+t('rp_n')+', '+fmt(k)+' '+u('kwh')+', '+fmt(l,0)+' '+u('lei')+', '+t('rp_avg')+' '+fmt(l/k,2)+' '+u('lei')+'/'+u('kwh');
 if(od.length>=2&&od[od.length-1].o>od[0].o){const km=od[od.length-1].o-od[0].o,kk=od.slice(1).reduce((a,x)=>a+x.k,0);s+=', '+fmt(km,0)+' '+u('km')+' '+t('rp_km')+', '+t('rp_cons')+' '+fmt(kk/km*100)+' '+u('kwh')+'/100 '+u('km')}
 bx.value=s;cp()};
$('mb').onclick=()=>drawer(true);$('ov').onclick=()=>drawer(false);
show(cur0);lang();
</script></body></html>
